name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, tipos e testes unitários
        run: npm run check

      - name: Build com variáveis fictícias de teste (.env.test)
        run: npm run build:test
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (segurança)
        run: npm run test:e2e

      - name: Guardar rastros de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  banco:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Migrações + testes de RLS
        run: supabase/tests/run.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/iron_test
