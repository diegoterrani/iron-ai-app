name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o CI só lê o código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (lockfile exato)
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint, tipos e testes unitários
        run: npm run check

      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta (segurança)
        run: npm run test:e2e

      - name: Guardar rastros de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
